[package]
name = "ss-core"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "time"] }

[dev-dependencies]
serde_json = "1.0.154"
