[package]
name = "ss-recorder"
version.workspace = true
edition.workspace = true

[dependencies]
bytes = "1.12.1"
chrono = "0.4.45"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ss-core = { version = "0.1.0", path = "../ss-core" }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
