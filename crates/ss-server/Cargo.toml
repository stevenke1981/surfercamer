[package]
name = "ss-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ssd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ss-camera = { version = "0.1.0", path = "../ss-camera" }
ss-core = { version = "0.1.0", path = "../ss-core" }
ss-db = { version = "0.1.0", path = "../ss-db" }
ss-engine = { version = "0.1.0", path = "../ss-engine" }
ss-recorder = { version = "0.1.0", path = "../ss-recorder" }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
