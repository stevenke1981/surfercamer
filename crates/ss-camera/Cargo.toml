[package]
name = "ss-camera"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = "0.4.45"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
ss-core = { version = "0.1.0", path = "../ss-core" }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
